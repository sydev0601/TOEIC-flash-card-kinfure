<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Lilita+One&family=Roboto+Slab:wght@100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
		rel="stylesheet">

	<title>TOEIC Flash Card</title>
</head>

<body>
	<div class="background">
		<div id="select-index-page">
			<div id="select-quiz-type-area">
				<button id="kinfure-btn" class="select-quiz-btn selected sn-pro-600" disabled>金フレ</button>
				<button id="memorizedBtn" class="select-quiz-btn sn-pro-600">Memorized</button>
			</div>
			<div id="skipBtn">
				<div class="sn-pro-400">Skip memorized words</div>
				<div class="toggle_button">
					<input id="skipMemorizedToggle" class="toggle_input" type='checkbox' />
					<label for="toggle" class="toggle_label">
				</div>
			</div>
			<div id="indexes"></div>
		</div>

		<div id="quizPlay" class="dispNone">
			<div id="upperInfo">
				<div id="indexNum" class="sn-pro-600"></div>
				<div id="count" class="sn-pro-600"></div>
				<div id="rate" class="sn-pro-600">
					<div id="transRate"></div>
				</div>
			</div>
			<div id="card" class="card">
				<div id="leftPage" class="page left-page">
					<div class="overlap-parent">
						<img src="Images/leftPage.svg" alt="問題">
						<div class="question roboto-slab-400"></div>
					</div>
				</div>
				<div id="flipLeftPage" class="page flip-left-page">
					<div class="overlap-parent">
						<img src="Images/leftPage.svg" alt="問題">
						<div class="question roboto-slab-400"></div>
					</div>
				</div>
				<div id="flipRightPage" class="page flip-right-page">
					<div class="overlap-parent">
						<img src="Images/rightPage.svg" alt="解答欄">
						<div class="answerArea">
							<div class="translationArea translation-area-dashed-frame"></div>
						</div>
						<div class="answerArea">
							<div class="translationArea">
								<div class="overlap-parent">
									<div class="transAns kosugi-maru-regular"></div>
									<img id="transCorrectIcon" src="Images/correct.svg" alt="正解"
										class="resultIcon dispNone">
									<img id="transUncorrectIcon" src="Images/uncorrect.svg" alt="不正解"
										class="resultIcon dispNone">
								</div>
							</div>
						</div>
					</div>
				</div>
				<div id="rightPage" class="page right-page">
					<div class="overlap-parent">
						<img src="Images/rightPage.svg" alt="解答欄">
						<div class="answerArea">
							<div class="translationArea translation-area-dashed-frame"></div>
						</div>
						<div class="answerArea">
							<div class="translationArea">
								<div class="overlap-parent">
									<div class="transAns"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div id="selectionArea" class="kosugi-maru-regular">
				<div id="translationSelectionArea">
					<button id="opt-btn-1" class="translationOpt"></button>
					<button id="opt-btn-2" class="translationOpt"></button>
					<button id="opt-btn-3" class="translationOpt"></button>
					<button id="opt-btn-4" class="translationOpt"></button>
				</div>
			</div>

			<div id="buttonArea">
				<img id="backBtn" src="Images/back.svg" alt="戻る">
				<button id="checkAnswerBtn" class="lilita-one-regular" disabled>Check Answer</button>
				<button id="nextBtn" class="lilita-one-regular" disabled>Next</button>
				<div>
					<img id="goodOffBtn" src="Images/goodOff.svg" alt="覚えた">
					<img id="goodOnBtn" src="Images/goodOn.svg" alt="覚えていない" class="dispNone">
				</div>
			</div>

		</div>

		<dialog id="no-word-dialog">
			<h2>There are no words.</h2>
			<button id="close-dialog-btn">Close</button>
		</dialog>

		<div id="quizFinish" class="dispNone">
			<div id="finish">
				<div class="overlap-parent">
					<img src="Images/flashcard_back.svg" alt="finish">
					<div class="lilita-one-regular">finish!</div>
				</div>
			</div>
			<div class="resultBox">
				<div id="transResult">
					<div id="qType">訳</div>
					<div id="rate" class="lilita-one-regular"></div>
					<div id="score" class="lilita-one-regular">50<span>/100</span></div>
				</div>
			</div>
			<button id="backSelectBtn" class="lilita-one-regular">Quiz Select</button>
		</div>
	</div>

	<script src="https://unpkg.com/dexie/dist/dexie.js"></script>
	<script src="script.js"></script>
</body>

</html>
